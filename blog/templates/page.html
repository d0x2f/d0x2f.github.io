{% extends "index.html" %}

{% block title %}{{ config.title }} - {{ page.title }}{% endblock %}

{% block content %}
<div class="post">
  <h1 class="title">{{ page.title }}</h1>
  <span class="date">{{ page.date | date(format="%-d %b %Y") }}</span>
  {{ page.content | safe }}
</div>
{% endblock content %}
